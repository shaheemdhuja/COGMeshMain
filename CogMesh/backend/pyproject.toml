[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cogmesh-backend"
version = "0.1.0"
description = "CogMesh: A Capability-Constrained Collaborative AI Runtime for Multi-Device Edge Intelligence"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "CogMesh Core Team" }
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]

[tool.black]
line-length = 88
target-version = ['py312']

[tool.ruff]
line-length = 88
target-version = "py312"
